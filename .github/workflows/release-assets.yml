# Attaches the downloads to every GitHub Release (v1.0, v1.1, ...):
#  - skill-chat-web-<tag>.zip : the web app, zipped from the tagged commit
#  - SkillChat-<tag>.apk      : the signed Android app, built on the maintainer's machine and hosted on the live site;
#                               its SHA-256 (release/SkillChat-<tag>.apk.sha256) is checked so nothing can be swapped.
name: release-assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.1'
        required: true
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build web-app zip from the repo
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          git archive --format=zip --prefix=skill-chat/ -o "skill-chat-web-$TAG.zip" HEAD
      - name: Download the signed APK and verify it
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -f "release/SkillChat-$TAG.apk.sha256" ]; then
            curl -fL --retry 3 -o "SkillChat-$TAG.apk" "https://skill-chat.sites.tab.bot/downloads/SkillChat-$TAG.apk"
            sha256sum -c "release/SkillChat-$TAG.apk.sha256"
            sha256sum "SkillChat-$TAG.apk" "skill-chat-web-$TAG.zip" > SHA256SUMS
          else
            sha256sum "skill-chat-web-$TAG.zip" > SHA256SUMS
          fi
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          FILES="skill-chat-web-$TAG.zip SHA256SUMS"; [ -f "SkillChat-$TAG.apk" ] && FILES="SkillChat-$TAG.apk $FILES"
          gh release upload "$TAG" $FILES --clobber --repo ${{ github.repository }}
